services:
  postgres:
    image: postgres:16-alpine
    container_name: ideciclo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideciclo}
      POSTGRES_USER: ${POSTGRES_USER:-ideciclo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideciclo}
      POSTGREST_DB_ANON_ROLE: ${POSTGREST_DB_ANON_ROLE:-web_anon}
      POSTGREST_DB_AUTHENTICATOR_USER: ${POSTGREST_DB_AUTHENTICATOR_USER:-authenticator}
      POSTGREST_DB_AUTHENTICATOR_PASSWORD: ${POSTGREST_DB_AUTHENTICATOR_PASSWORD:-change_me_local_password}
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - ideciclo-postgres-data:/var/lib/postgresql/data
      - ./docker/init/00-postgrest-role.sh:/docker-entrypoint-initdb.d/00-postgrest-role.sh:ro
      - ./supabase/bootstrap_full_schema.sql:/docker-entrypoint-initdb.d/10-bootstrap_full_schema.sql:ro
      - ./docker/init/99-postgrest-permissions.sql:/docker-entrypoint-initdb.d/99-postgrest-permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:latest
    container_name: ideciclo-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGREST_DB_AUTHENTICATOR_USER:-authenticator}:${POSTGREST_DB_AUTHENTICATOR_PASSWORD:-change_me_local_password}@postgres:5432/${POSTGRES_DB:-ideciclo}
      PGRST_DB_SCHEMAS: ${POSTGREST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: ${POSTGREST_DB_ANON_ROLE:-web_anon}
      PGRST_SERVER_PORT: ${POSTGREST_PORT:-3000}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${POSTGREST_PORT:-3000}
    ports:
      - "${POSTGREST_PORT:-3000}:${POSTGREST_PORT:-3000}"

volumes:
  ideciclo-postgres-data:
